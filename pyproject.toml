[project]
name = "dag-forge"
version = "0.1.0"
description = "The ultimate DAG Factory development toolkit for Airflow engineers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DAG Forge Contributors" }
]
keywords = [
    "airflow",
    "dag-factory",
    "yaml",
    "data-engineering",
    "orchestration",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    "ruamel.yaml>=0.18,<1.0",
    "networkx>=3.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.0,<4.0",
    "jinja2>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.scripts]
dagforge = "dagforge.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
